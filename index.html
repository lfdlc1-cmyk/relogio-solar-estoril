<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relógio Solar">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.svg">
<title>Relógio Solar · Estoril</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100svh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{width:min(100%,440px);display:flex;flex-direction:column;align-items:center}
svg{width:100%;height:auto;display:block}
.status{width:86%;display:flex;justify-content:space-between;color:#aaa;font-size:10px;letter-spacing:1.2px;margin-top:3px}
.place{font-size:11px;letter-spacing:1.5px;color:#999;margin-top:13px}
</style>
</head>
<body>
<main>
<svg viewBox="0 0 400 400" role="img" aria-label="Relógio solar circular para o Estoril">
<defs>
 <linearGradient id="solarArc" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffae00"/><stop offset="48%" stop-color="#ffd51b"/><stop offset="100%" stop-color="#555"/></linearGradient>
 <radialGradient id="sunGlow"><stop offset="0%" stop-color="#ffe74a" stop-opacity="1"/><stop offset="45%" stop-color="#ffb900" stop-opacity=".45"/><stop offset="100%" stop-color="#ffb900" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<circle cx="200" cy="200" r="190" fill="#000" stroke="#777" stroke-width="1.5"/>
<circle cx="200" cy="200" r="190" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>
<path d="M200 20 A180 180 0 1 0 200 380" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<path id="solar-progress" d="M200 20 A180 180 0 1 0 200 380" fill="none" stroke="url(#solarArc)" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="50 50"/>
<circle id="sun-halo" cx="0" cy="0" r="28" fill="url(#sunGlow)" filter="url(#glow)"/>
<circle id="sun-dot" cx="0" cy="0" r="7" fill="#ffe52b"/>
<text id="clock-time" x="200" y="177" text-anchor="middle" fill="#fff" font-size="69" font-weight="300" letter-spacing="-2">--:--</text>
<text id="clock-date" x="200" y="212" text-anchor="middle" fill="#fff" font-size="21" font-weight="300">---</text>
<g transform="translate(128 258)" stroke="#ffdf00" fill="none" stroke-width="3">
 <path d="M-15 0 A15 15 0 0 1 15 0 M-23 5 H23 M0 -26 V-19 M-19 -19 L-14 -14 M19 -19 L14 -14"/>
</g>
<g transform="translate(272 258)" stroke="#ffae00" fill="none" stroke-width="3">
 <path d="M-15 0 A15 15 0 0 1 15 0 M-23 5 H23 M0 -26 V-19 M-19 -19 L-14 -14 M19 -19 L14 -14"/>
</g>
<text id="sunrise" x="128" y="302" text-anchor="middle" fill="#fff" font-size="29" font-weight="300">--:--</text>
<text id="sunset" x="272" y="302" text-anchor="middle" fill="#fff" font-size="29" font-weight="300">--:--</text>
<path d="M200 245 V305" stroke="#aaa" stroke-width="1.5"/>
<text x="200" y="345" text-anchor="middle" fill="#fff" font-size="25" font-weight="300" letter-spacing="1">ESTORIL</text>
</svg>
<div class="status"><span>POSIÇÃO SOLAR</span><span id="sun-status">A CALCULAR</span></div>
<div class="place">ESTORIL · PORTUGAL</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),lat=38.705,lon=-9.397,rad=Math.PI/180;
function solar(date){
 const y=date.getFullYear(),m=date.getMonth(),d=date.getDate();
 const N=Math.floor((Date.UTC(y,m,d)-Date.UTC(y,0,0))/86400000),g=2*Math.PI/365*(N-1);
 const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
 const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
 const c=Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(dec))-Math.tan(lat*rad)*Math.tan(dec);
 const ha=Math.acos(Math.max(-1,Math.min(1,c))),noon=720-4*lon-eq,offset=-date.getTimezoneOffset();
 const fmt=v=>{let n=(Math.round(v+offset)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
 return {rise:noon-4*ha/rad,set:noon+4*ha/rad,fmt};
}
function update(){
 const now=new Date(),s=solar(now),mins=now.getHours()*60+now.getMinutes();
 $('clock-time').textContent=now.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',hour12:false});
 $('clock-date').textContent=now.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'').toUpperCase();
 $('sunrise').textContent=s.fmt(s.rise);$('sunset').textContent=s.fmt(s.set);
 const p=Math.max(0,Math.min(1,(mins-s.rise)/(s.set-s.rise))),a=Math.PI*(1+p),x=200+180*Math.cos(a),y=200+180*Math.sin(a);
 $('sun-dot').setAttribute('cx',x);$('sun-dot').setAttribute('cy',y);$('sun-halo').setAttribute('cx',x);$('sun-halo').setAttribute('cy',y);
 $('solar-progress').setAttribute('stroke-dasharray',(p*100)+' '+(100-p*100));
 $('sun-status').textContent=mins<s.rise?'ANTES DO NASCER DO SOL':mins>s.set?'DEPOIS DO PÔR DO SOL':'DIA · '+Math.round(p*100)+'%';
}
update();setInterval(update,60000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}
})();
</script>
</body>
</html>
